<!DOCTYPE html>

<!--

  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-auto" lang="en"> <!-- Update `class="theme-auto"` with your preference -->

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page Title - Change this to your name/brand (50-60 characters recommended) -->
    <title>Tan Jia Hao 陈嘉豪</title>
    <link rel="icon" type="image/png" href="images/head.png"> <!-- Update this with your own favicon -->

    <!-- Meta Description - Write a description (150-160 characters recommended) -->
    <meta name="description" content="Tan Jia Hao 陈嘉豪 | Double Bassist in Foon Yew Symphony Orchestra & R&F Youth Wind Band. Connect with me on Instagram, WhatsApp, Messenger, Discord & GitHub.">

    <!-- Canonical URL - Helps prevent duplicate content issues -->

    <!-- Author Information -->
    <meta name="author" content="Tan Jia Hao 陈嘉豪">

    <!-- Browser UI Color - Matches the default light/dark theme backgrounds -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

    <!-- Social Sharing (Open Graph & Twitter) - Uncomment and fill in to control how your page
         looks when shared on social platforms and in chat apps.
         og:url and og:image must be full absolute URLs. -->
    <!--
    <meta property="og:type" content="website">
    <meta property="og:title" content="Your Name">

    <meta property="og:image" content="https://yourwebsite.com/images/avatar@2x.png">
    <meta name="twitter:card" content="summary">
    -->

    <!-- Font Preloads - Lets the browser fetch fonts in parallel with the stylesheets -->
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-800.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

    <!-- LittleLink Extended Stylesheet (Optional) -->
    <!-- <link rel="stylesheet" href="css/brands-extended.css"> -->
    <!-- Learn more at https://github.com/sethcottle/littlelink-extended.
         Remove comments if you've added LittleLink Extended dependencies -->

  </head>

<body>

    <div class="container">
        <div class="column">
          <main>

            <!--
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
            <img class="avatar avatar--rounded" src="images/head.png" srcset="images/head2x.png 2x" alt="Tan Jia Hao" width="128" height="128" fetchpriority="high">

            <!-- Replace with your name or brand -->
            <h1>Tan Jia Hao 陈嘉豪</h1>

            <!-- Add a short description about yourself or your brand -->
            <p>Double Bassist in Foon Yew Symphony Orchestra & R&F Youth Wind Band.</p>

            <!-- All your buttons go here -->
      <nav class="button-stack" aria-label="Links">

        <!-- Instagram -->
        <a class="button button-instagram" href="https://instagram.com/tanjiahaoo" target="_blank" rel="noopener">
          <img class="icon" aria-hidden="true" src="images/icons/instagram.svg" alt="Instagram Logo"> Instagram
        </a>

        <!-- WhatsApp -->
        <a class="button button-whatsapp" href="https://wa.me/60167268833" target="_blank" rel="noopener">
          <img class="icon" aria-hidden="true" src="images/icons/whatsapp.svg" alt="WhatsApp Logo"> WhatsApp
        </a>
        
        <!-- Email (可展开复制) -->
        <div class="expand-wrapper">
          <button type="button" class="button button-default" onclick="toggleExpand('email-box')">
            <img class="icon" aria-hidden="true" src="images/icons/gmail.svg" alt="Email Logo"> Email
          </button>
          <div id="email-box" class="expand-content" style="display: none;">
            <span id="email-text">tanjiahao642@gmail.com</span>
            <button type="button" class="copy-btn" onclick="copyText('email-text', this)">Copy</button>
          </div>
        </div>

        <!-- Messenger -->
        <a class="button button-messenger" href="https://m.me/tanjiahaoo" target="_blank" rel="noopener">
          <img class="icon" aria-hidden="true" src="images/icons/messenger.svg" alt="Messenger Logo"> Messenger
        </a>

        <!-- Facebook -->
        <a class="button button-facebook" href="https://facebook.com/tanjiahaoo" target="_blank" rel="noopener">
          <img class="icon" aria-hidden="true" src="images/icons/facebook.svg" alt="Facebook Logo"> Facebook
        </a>

        <!-- Discord (可展开复制) -->
        <div class="expand-wrapper">
          <button type="button" class="button button-discord" onclick="toggleExpand('discord-box')">
            <img class="icon" aria-hidden="true" src="images/icons/discord.svg" alt="Discord Logo"> Discord
          </button>
          <div id="discord-box" class="expand-content" style="display: none;">
            <span id="discord-text">tanjiahaoo</span>
            <button type="button" class="copy-btn" onclick="copyText('discord-text', this)">Copy</button>
          </div>
        </div>

        <!-- GitHub -->
        <a class="button button-github" href="https://github.com/Jiahao0616" target="_blank" rel="noopener">
          <img class="icon" aria-hidden="true" src="images/icons/github.svg" alt="GitHub Logo"> GitHub
        </a>

      </nav>
      </main>

      <!-- Feel free to add your own footer information, including updating `privacy.html` to reflect how your LittleLink fork is set up -->
      <footer>
        <!-- a href="privacy.html">Privacy Policy</a> | Build your own by forking <a href="https://littlelink.io" target="_blank" rel="noopener">LittleLink</a>-->
      </footer>

    </div>
  </div>
<style>
  /* 展开面板样式 */
  .expand-wrapper {
    width: 100%;
    margin-bottom: 8px;
  }
  .expand-content {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    padding: 10px 16px;
    margin-top: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    color: #fff;
  }
  .copy-btn {
    background: #4a5568;
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
    transition: background 0.2s;
  }
  .copy-btn:hover {
    background: #2d3748;
  }
</style>

<script>
  // 展开/收起切换
  function toggleExpand(id) {
    var box = document.getElementById(id);
    if (box.style.display === "none" || box.style.display === "") {
      box.style.display = "flex";
    } else {
      box.style.display = "none";
    }
  }

  // 复制文字并提示
  function copyText(textId, btn) {
    var text = document.getElementById(textId).innerText;
    navigator.clipboard.writeText(text).then(function() {
      var originalText = btn.innerText;
      btn.innerText = "Copied!";
      btn.style.background = "#38a169";
      setTimeout(function() {
        btn.innerText = originalText;
        btn.style.background = "#4a5568";
      }, 1500);
    });
  }
</script>
</body>

</html>
